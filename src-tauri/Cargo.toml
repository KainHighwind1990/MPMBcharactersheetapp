[package]
name = "mpmb-character-sheet"
version = "0.9.1-dev.1"
description = "MPMB Web Character Sheet desktop application"
authors = ["MPMB Web Sheet Project"]
edition = "2021"

[lib]
name = "mpmb_character_sheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
