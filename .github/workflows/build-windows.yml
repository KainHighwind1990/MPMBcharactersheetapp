name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows application
        run: npm run desktop:build

      - name: Collect Windows packages
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path windows-build

          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "windows-build/" -ErrorAction SilentlyContinue
          }

          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "windows-build/" -ErrorAction SilentlyContinue
          }

          if (Test-Path "src-tauri/target/release/mpmb-character-sheet.exe") {
            Copy-Item "src-tauri/target/release/mpmb-character-sheet.exe" "windows-build/MPMB-Character-Sheet-portable.exe"
          }

          Write-Host "Windows build contents:"
          Get-ChildItem windows-build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MPMB-Character-Sheet-0.9.0-Windows-x64
          path: windows-build/*
          if-no-files-found: error
